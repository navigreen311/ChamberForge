name: Security Scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
      - run: pip install pip-audit
      - run: cd backend && pip-audit -r requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: cd frontend && npm audit --production

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -rn "sk_live_\|AKIA[A-Z0-9]\|password\s*=\s*['\"][^'\"]*['\"]" backend/app/ frontend/src/ --include="*.py" --include="*.ts" --include="*.tsx" | grep -v "YOUR_\|PLACEHOLDER\|changeme\|example\|test\|mock"
