name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Run linter
        run: cd backend && pip install ruff && ruff check .
      # The suite has 191 known failures spread across a dozen packages that
      # fix them in parallel. Gating on a fully green suite would block the
      # whole run for weeks; gating on nothing would let regressions through.
      # So this gates on the delta: CI fails only when a test outside
      # backend/tests/known_failures.txt fails. P-26 asserts that file is empty.
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: cd backend && python -m pytest tests/ --tb=short -q --junitxml=../test-report.xml
      - name: Fail only on NEW test failures
        run: python scripts/check_test_regressions.py test-report.xml

  integration-real:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start test infrastructure
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker compose -f docker-compose.test.yml exec -T test-db pg_isready -U test -d chamberforge_test && break
            sleep 2
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            docker compose -f docker-compose.test.yml exec -T test-redis redis-cli ping | grep -q PONG && break
            sleep 2
          done
          echo "Waiting for Elasticsearch..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:9201/_cluster/health > /dev/null && break
            sleep 3
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5433/chamberforge_test
          REDIS_URL: redis://localhost:6380
          ELASTICSEARCH_URL: http://localhost:9201
          JWT_SECRET: test-secret-key
          APP_ENV: testing
        run: |
          cd backend && python -m pytest \
            tests/integration/test_real_postgres.py \
            tests/integration/test_real_redis.py \
            tests/integration/test_real_elasticsearch.py \
            -v --tb=short -c tests/conftest_docker.py
      - name: Tear down test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      # The generated Prisma client is not committed, so it must be produced
      # before anything typechecks or builds. `npm ci` runs postinstall, but
      # this is explicit so a failure here is unambiguous.
      - name: Generate Prisma client
        run: cd frontend && npx prisma generate
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Lint
        run: cd frontend && npx next lint
      - name: Build
        run: cd frontend && npm run build

  migration-drift:
    # T-016. The audit found four models whose tables were never created, so
    # any database built by `alembic upgrade head` was missing MFA, wealth
    # events, community intel and white-label. Nothing caught it because
    # nothing was looking. This job is that check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every model has a table in the revision chain
        run: python scripts/check_migration_drift.py --baseline scripts/migration_drift_baseline.txt
      # P-01 (D4). Prisma owns the domain models. Ten still exist as
      # SQLAlchemy models with 25 files importing them; this ratchets that
      # set down rather than letting new code join it. Ownership map is
      # docs/data-architecture.md. P-26 asserts the baseline is empty.
      - name: Check nothing new depends on a Prisma-owned model
        run: python scripts/check_domain_ownership.py
