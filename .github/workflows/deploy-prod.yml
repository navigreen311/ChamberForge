name: Deploy to Production

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECS_CLUSTER: chamberforge-prod
  BACKEND_ECR_REPO: chamberforge-backend
  FRONTEND_ECR_REPO: chamberforge-frontend
  BACKEND_ECS_SERVICE: chamberforge-backend-prod
  FRONTEND_ECS_SERVICE: chamberforge-frontend-prod
  BACKEND_TASK_DEF: chamberforge-backend-prod
  FRONTEND_TASK_DEF: chamberforge-frontend-prod

jobs:
  # T-024. Production previously deployed on any v* tag with no test gate at
  # all - build-and-push was the only dependency in the file. A tag now has
  # to pass the same checks a pull request does before an image is built.
  pre-deploy-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: cd backend && pip install -r requirements.txt ruff
      - name: Backend lint
        run: cd backend && ruff check .
      - name: Backend tests
        run: cd backend && python -m pytest tests/ -q --tb=short
      - name: Model/migration drift
        run: python scripts/check_migration_drift.py
      - name: Frontend deps
        run: cd frontend && npm ci
      - name: Frontend typecheck and build
        run: cd frontend && npx prisma generate && npm run typecheck && npm run build

  build-and-push:
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag from git tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: |
          docker build -f infra/Dockerfile.backend \
            -t ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:latest

      - name: Build and push frontend image
        run: |
          docker build -f infra/Dockerfile.frontend \
            -t ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:latest

  deploy-blue-green:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.BACKEND_TASK_DEF }} \
            --query taskDefinition > backend-task-def.json

      - name: Update backend task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_ECR_REPO }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy backend (blue/green via CodeDeploy)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: infra/appspec-backend.json
          codedeploy-application: chamberforge-backend-prod
          codedeploy-deployment-group: chamberforge-backend-prod-dg

      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.FRONTEND_TASK_DEF }} \
            --query taskDefinition > frontend-task-def.json

      - name: Update frontend task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_ECR_REPO }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy frontend (blue/green via CodeDeploy)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.FRONTEND_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          codedeploy-appspec: infra/appspec-frontend.json
          codedeploy-application: chamberforge-frontend-prod
          codedeploy-deployment-group: chamberforge-frontend-prod-dg

  verify:
    needs: deploy-blue-green
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.chamberforge.com/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts"
          exit 1
