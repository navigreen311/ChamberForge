<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChamberForge — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a1929;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .container { max-width: 420px; }
      .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 700;
        color: #0a1929;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #fbbf24; }
      p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: #fbbf24;
        color: #0a1929;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">C</div>
      <h1>You're Offline</h1>
      <p>
        ChamberForge requires an internet connection for full functionality.
        Please check your connection and try again.
      </p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
